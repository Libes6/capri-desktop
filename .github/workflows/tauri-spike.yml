# TAURI-00 spike CI: builds spike/tauri-overlay on Windows and Linux (X11) and checks that the
# overlay window is created and WebGL works (the page writes "AUTOTEST webgl=ok ..." to the log).
# Soft checks (reported in the job summary, never fail the job): click-through flip with a synthetic cursor.
# Never run from this repo yet: see docs/TAURI_SPIKE.md.
name: tauri-spike

on:
  workflow_dispatch:
  push:
    paths:
      - 'spike/**'
      - '.github/workflows/tauri-spike.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: spike/tauri-overlay/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spike/tauri-overlay/src-tauri
      - name: Build (WebView2 is preinstalled on the runner)
        run: cargo build --release
      - name: Run, click-through probe, screenshot
        shell: pwsh
        run: |
          $env:SPIKE_EXIT_AFTER = '25'
          $p = Start-Process -FilePath ".\target\release\capri-overlay-spike.exe" -RedirectStandardOutput spike.log -RedirectStandardError spike.err -PassThru
          Start-Sleep -Seconds 8
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @"
          using System.Runtime.InteropServices;
          public class Native { [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y); }
          "@
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          # the character stands near the bottom-right corner (see www/main.js): aim at her body, then at empty desktop
          [Native]::SetCursorPos($b.Width - 186, $b.Height - 199) | Out-Null
          Start-Sleep -Milliseconds 600
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen(0, 0, 0, 0, $bmp.Size)
          $bmp.Save("$PWD\screenshot.png")
          [Native]::SetCursorPos(100, 100) | Out-Null
          Start-Sleep -Seconds 1
          $p.WaitForExit(30000) | Out-Null
          Get-Content spike.log
          Get-Content spike.err -ErrorAction SilentlyContinue
      - name: Check
        shell: pwsh
        run: |
          $log = Get-Content spike.log -Raw
          $ok = $true
          if ($log -notmatch 'window=created') { Write-Error 'overlay window was not created'; $ok = $false }
          if ($log -notmatch 'AUTOTEST webgl=ok') { Write-Error 'WebGL not available or sprite did not draw'; $ok = $false }
          $flip = if ($log -match 'ignore_cursor_events=false') { 'yes' } else { 'NO' }
          "### Windows`n- window created / WebGL: checked`n- click-through flipped to 'catch' over the character: $flip`n``````n$((Select-String -Path spike.log -Pattern 'AUTOTEST|window=created|ignore_cursor' | ForEach-Object Line) -join "`n")`n``````" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          if (-not $ok) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-spike
          path: |
            spike/tauri-overlay/src-tauri/spike.log
            spike/tauri-overlay/src-tauri/spike.err
            spike/tauri-overlay/src-tauri/screenshot.png

  linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: spike/tauri-overlay/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential pkg-config libssl-dev \
            xvfb openbox picom xdotool imagemagick libgl1-mesa-dri libglx-mesa0 mesa-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spike/tauri-overlay/src-tauri
      - name: Build
        run: cargo build --release
      - name: Run under Xvfb + openbox + picom (an ARGB visual needs a compositor), probe, screenshot
        run: bash ../scripts/ci-linux.sh
      - name: Check
        run: |
          set -e
          grep -q 'window=created' spike.log || { echo '::error::overlay window was not created'; exit 1; }
          grep -q 'AUTOTEST webgl=ok' spike.log || { echo '::error::WebGL not available or sprite did not draw'; exit 1; }
          flip=$(grep -q 'ignore_cursor_events=false' spike.log && echo yes || echo NO)
          {
            echo '### Linux (X11, Xvfb, Mesa llvmpipe)'
            echo "- window created / WebGL: checked"
            echo "- click-through flipped to 'catch' over the character: $flip"
            echo '```'; grep -E 'AUTOTEST|window=created|ignore_cursor' spike.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-spike
          path: |
            spike/tauri-overlay/src-tauri/spike.log
            spike/tauri-overlay/src-tauri/screenshot.png
