name: Desktop builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            script: dist:win
            executable: dist/win-unpacked/Capri.exe
          - platform: linux-x64
            runner: ubuntu-22.04
            script: dist:linux
            executable: dist/linux-unpacked/capri-desktop
          - platform: macos-arm64
            runner: macos-15
            script: dist:mac
            executable: dist/mac-arm64/Capri.app/Contents/MacOS/Capri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 xvfb dbus-x11 openbox xcompmgr x11-utils libgtk-3-0 libnss3 libasound2
      - run: npm ci --no-audit --no-fund
      # the window helper (Swift, Xcode's swiftc); electron-builder's beforePack builds it too, this fails earlier
      - name: Build macOS window helper
        if: runner.os == 'macOS'
        run: npm run build:mac-helper
      - run: npm test
      - name: Package installers
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Launch packaged app (Windows)
        if: runner.os == 'Windows'
        run: node scripts/smoke-test.js "${{ matrix.executable }}"
      # the packaged helper found (Resources/bin) and its first snapshot read: window tracking on
      - name: Launch packaged app (macOS)
        if: runner.os == 'macOS'
        run: |
          test -x dist/mac-arm64/Capri.app/Contents/Resources/bin/capri-windows
          node scripts/smoke-test.js "${{ matrix.executable }}" --expect-window-tracking
      - name: Launch packaged app (Linux X11)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- xvfb-run -a bash -c '
            openbox > /tmp/capri-openbox.log 2>&1 &
            xcompmgr > /tmp/capri-compositor.log 2>&1 &
            node scripts/smoke-test.js "${{ matrix.executable }}"
          '
      # an extra check of the X11 window watcher on Xvfb + openbox, not proof for real desktops
      - name: X11 window watcher probe (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a bash -c '
            openbox > /tmp/capri-openbox-probe.log 2>&1 &
            sleep 1
            xmessage -geometry 420x260+150+120 "Capri X11 probe" &
            sleep 1
            node scripts/x11-probe.js
          '
      # the installers, and what in-app updates read (latest*.yml, blockmaps; docs/UPDATES.md)
      - name: Check update files
        shell: bash
        run: ls dist/latest*.yml
      - uses: actions/upload-artifact@v4
        with:
          name: capri-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
            dist/*.blockmap

  draft-release:
    name: Create or update draft release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    # the Tauri pipeline (tauri-release.yml) fills the same draft: one writer at a time, neither cancels the other
    concurrency:
      group: capri-fork-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: capri-*
          merge-multiple: true
          path: release-assets
      - name: Attach all platforms to draft
        run: node scripts/draft-release.js release-assets
        env:
          GH_TOKEN: ${{ github.token }}
