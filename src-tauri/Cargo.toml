[package]
name = "capri"
version = "0.1.0"
description = "Capri, the Project Capricorn construct, living on your desktop (Tauri shell)"
authors = ["mochiiwuff"]
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
default-run = "capri"

[lib]
name = "capri_lib"
crate-type = ["rlib"]

[[bin]]
name = "capri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "~2.7", features = [] }

[dependencies]
tauri = { version = "~2.12", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "~2.5"
tauri-plugin-global-shortcut = "~2.4"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
