[package]
name = "capri"
version = "0.1.0"
description = "Capri, the Project Capricorn construct, living on your desktop (Tauri shell)"
authors = ["mochiiwuff"]
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
default-run = "capri"

[lib]
name = "capri_lib"
crate-type = ["rlib"]

[[bin]]
name = "capri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "~2.7", features = [] }

[dependencies]
tauri = { version = "~2.12", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "~2.5"
tauri-plugin-global-shortcut = "~2.4"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
# TAURI-07: native services
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
arboard = { version = "=3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
open = "=5.4.4"
tauri-plugin-dialog = "~2.8"
png = "0.18"
jpeg-encoder = "0.7"
getrandom = "0.3"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSNotification", "NSString", "NSDictionary", "NSURL", "NSOperation", "NSObject", "NSEnumerator"] }
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
